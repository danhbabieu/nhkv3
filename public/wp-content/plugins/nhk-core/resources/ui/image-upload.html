    <input id="context" type="text" maxlength="500" placeholder="Ví dụ: máy, mặt trước, logo, mặt số của đồng hồ 36" autocomplete="off" />
    <input id="files" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple disabled />
    <div id="actions">
      <button id="select" type="button" hidden disabled>Chọn ảnh từ thư viện ChatGPT</button>
      <button id="upload" type="button" disabled>Tải ảnh lên</button>
    </div>
    <details id="article-panel">
      <summary>Tạo bài viết</summary>
      <div id="article-fields">
        <label for="article-title">Tiêu đề bài viết</label>
        <input id="article-title" type="text" maxlength="500" placeholder="Tùy chọn" autocomplete="off" />
        <label for="article-text">Nội dung / yêu cầu bài viết</label>
        <textarea id="article-text" maxlength="20000" placeholder="Nhập nội dung hoặc yêu cầu bài viết dài…"></textarea>
        <button id="create" type="button" disabled>Tạo bài viết</button>
      </div>
    </details>
    <div id="summary" aria-live="polite">Chưa chọn ảnh.</div>
    <div id="previews"></div>
    <div id="status" role="status" aria-live="polite">ĐANG KẾT NỐI</div>
    <div id="results" aria-live="polite"></div>
    <div id="diagnostics" aria-live="polite" aria-label="Chẩn đoán widget"></div>
  </body>
</html>
