<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NHK image uploader</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 16px; }
      button, input { font: inherit; }
      button { cursor: pointer; padding: 8px 12px; }
      button:disabled, input:disabled { cursor: not-allowed; opacity: .6; }
      #actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
      #previews { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin: 14px 0; }
      figure { margin: 0; border: 1px solid color-mix(in srgb, currentColor 22%, transparent); border-radius: 8px; overflow: hidden; }
      figure img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
      figcaption { padding: 6px; font-size: 12px; overflow-wrap: anywhere; }
      #state { font-weight: 700; }
      #status { margin-top: 10px; white-space: pre-wrap; }
      #results { display: grid; gap: 4px; margin-top: 8px; }
      .success { color: #16803c; } .failure { color: #bb2434; }
    </style>
  </head>
  <body>
    <h2>NHK image uploader</h2>
    <p>Select one or more images. They will be stored as canonical NHK Media.</p>
    <p>State: <span id="state">CONNECTING</span></p>
    <input id="files" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple disabled />
    <div id="actions">
      <button id="select" type="button" hidden disabled>Select files</button>
      <button id="upload" type="button" disabled>Upload selected images</button>
      <button id="use" type="button" disabled>Use these images in chat</button>
    </div>
    <div id="summary" aria-live="polite">No images selected.</div>
    <div id="previews"></div>
    <div id="status" role="status" aria-live="polite">CONNECTING</div>
    <div id="results" aria-live="polite"></div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
