<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trình tải ảnh NHK</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 16px; }
      button, input { font: inherit; }
      button { cursor: pointer; padding: 8px 12px; }
      button:disabled, input:disabled { cursor: not-allowed; opacity: .6; }
      #actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
      #description { box-sizing: border-box; display: block; width: 100%; min-height: 120px; padding: 12px; resize: vertical; }
      #previews { display: grid; gap: 16px; margin: 14px 0; }
      figure { display: grid; gap: 10px; margin: 0; padding: 10px; border: 1px solid color-mix(in srgb, currentColor 22%, transparent); border-radius: 10px; }
      figure img { display: block; width: 100%; max-height: 280px; aspect-ratio: 4 / 3; object-fit: contain; background: color-mix(in srgb, currentColor 8%, transparent); }
      figure input, figure button { box-sizing: border-box; width: 100%; min-height: 44px; padding: 10px; }
      .asset-label { font-weight: 700; }
      figcaption { font-size: 12px; overflow-wrap: anywhere; opacity: .75; }
      #state { font-weight: 700; }
      #status { margin-top: 10px; white-space: pre-wrap; }
      #results { display: grid; gap: 4px; margin-top: 8px; }
      #diagnostics { display: grid; gap: 2px; margin-top: 12px; font: 11px ui-monospace, monospace; opacity: .8; }
      .success { color: #16803c; } .failure { color: #bb2434; }
    </style>
  </head>
  <body>
    <h2>Ảnh NHK</h2>
    <p>Chọn một hoặc nhiều ảnh. Mỗi ảnh có tên và Feature riêng; mô tả chung áp dụng cho cả submission.</p>
    <p>Trạng thái: <span id="state">CONNECTING</span></p>
    <input id="files" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple disabled />
    <div id="actions">
      <button id="select" type="button" hidden disabled>Chọn ảnh từ thư viện ChatGPT</button>
      <button id="upload" type="button" disabled>TẢI LÊN</button>
    </div>
    <label for="description">Mô tả chung</label>
    <textarea id="description" maxlength="20000" placeholder="Mô tả chung cho toàn bộ ảnh…"></textarea>
    <div id="summary" aria-live="polite">Chưa chọn ảnh.</div>
    <div id="previews"></div>
    <div id="status" role="status" aria-live="polite">ĐANG KẾT NỐI</div>
    <div id="results" aria-live="polite"></div>
    <div id="diagnostics" aria-live="polite" aria-label="Chẩn đoán widget"></div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
