    name: Mặt số nổi chân cài
    owner_confirmed_same_identity: true

  - action: MERGE_CANDIDATE
    entity_type: component
    source_uuid: 01bead27-1308-48c1-af99-c68318e2b577
    source_key: nhk:component:o-do.dial.applied-glued
    target_uuid: e326a326-ae8c-447f-a2a4-a83a3cf168d4
    target_key: nhk:component:odo.dial.applied-glued
    name: Mặt số nổi số dán
    owner_confirmed_same_identity: false

bulk_rekey_rules:
  - match_prefix: nhk:model:o-do.
    target_prefix: nhk:model:odo.
    exclude:
      - nhk:model:o-do.35
    collision_policy: fail_closed_and_review

  - match_prefix: nhk:movement:o-do.
    target_prefix: nhk:movement:odo.
    exclude:
      - nhk:movement:o-do.35
    collision_policy: fail_closed_and_review

  - match_prefix: nhk:variant:o-do.
    target_prefix: nhk:variant:odo.
    exclude:
      - nhk:variant:o-do.36.35
    collision_policy: fail_closed_and_review

  - match_prefix: nhk:component:o-do.
    target_prefix: nhk:component:odo.
    exclude:
      - nhk:component:o-do.dial.applied-pinned
    collision_policy: fail_closed_and_review

  - match_prefix: nhk:knowledge:o-do.
    target_prefix: nhk:knowledge:odo.
    exclude: []
    collision_policy: fail_closed_and_review

canonical_branches:
  odo_24:
