pack:
  id: nhk-v3-brand-pack-odo
  display_name: Odo
  version: '1.0'
  status: approved-design
  canonical_namespace: odo
  forbid_new_namespace:
    - o-do
  constitutional_precedence:
    - AGENTS.md
    - docs/constitution/READ_FIRST.md
    - docs/constitution/NHK_V3_CONSTITUTION.md
    - runtime registries/contracts
    - this manifest

global_rules:
  preserve_uuid_on_rekey_when_supported: true
  hard_delete_for_namespace_normalization: false
  all_mutations_governed: true
  relation_predicates_must_resolve_from_registry: true
  article_body_authority: wordpress
  faq_is_projection: true
  timeline_is_projection: true
  recognition_profile_is_projection: true
  media_fake_url_forbidden: true
  video_standalone_forbidden: true

entities:
