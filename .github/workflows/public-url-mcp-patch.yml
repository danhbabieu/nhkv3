name: Public URL MCP patch
on:
  push:
    branches: [feature/canonical-public-slug-policy]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip url-mcp-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Apply bounded patch
        run: python3 tools/patch-public-url-mcp.py
      - name: Verify patch syntax
        run: php -l public/wp-content/plugins/nhk-core/src/Application/Mcp/McpTransport.php && php -l public/wp-content/plugins/nhk-core/src/Infrastructure/PublicIdentity/WordPressPublicUrlMaintenanceRuntime.php
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/wp-content/plugins/nhk-core
          git diff --cached --check
          git commit -m 'feat: wire MCP public URL maintenance [skip url-mcp-patch]'
          git push origin HEAD:feature/canonical-public-slug-policy
