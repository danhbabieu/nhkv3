name: Dictionary verification

on:
  push:
    branches:
      - feature/dictionary-lexical-knowledge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Diff whitespace check
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD

      - name: PHP syntax lint
        run: composer lint

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite 'NHK Unit'

      - name: Contract tests
        run: vendor/bin/phpunit --testsuite 'NHK Contract'
