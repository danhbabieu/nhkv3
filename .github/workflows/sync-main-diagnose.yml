name: Diagnose main sync conflicts

on:
  push:
    branches: [feature/canonical-public-slug-policy]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[skip sync-diagnose]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose merge and persist conflict list
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          code=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U || true)"
          git merge --abort || true
          printf '%s\n' "$conflicts" > tools/merge-conflicts.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/merge-conflicts.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record main sync conflicts [skip sync-diagnose]'
            git push origin HEAD:feature/canonical-public-slug-policy
          fi
          exit $code
