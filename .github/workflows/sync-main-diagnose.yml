name: Sync main into canonical URL branch

on:
  push:
    branches: [feature/canonical-public-slug-policy]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip sync-main]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff origin/main
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            git checkout --theirs -- docs/architecture/VIDEO_SEMANTIC_INGEST_CONTRACT.md
            git checkout --theirs -- public/wp-content/plugins/nhk-core/tests/Unit/PublicIdentityServiceTest.php
            git checkout --ours -- public/wp-content/plugins/nhk-core/tests/Unit/VideoSemanticCoreTest.php
            git checkout --theirs -- public/wp-content/plugins/nhk-core/tests/Unit/VideoUrlPolicyTest.php
            git checkout --theirs -- public/wp-content/plugins/nhk-core/nhk-core.php
            git checkout --theirs -- public/wp-content/plugins/nhk-core/src/Application/Entity/PublicRouteResolver.php
            git checkout --theirs -- public/wp-content/plugins/nhk-core/src/Application/PublicIdentity/CanonicalPublicSlugPolicy.php
            git checkout --theirs -- public/wp-content/plugins/nhk-core/src/Application/PublicIdentity/PublicIdentityService.php
            git checkout --theirs -- public/wp-content/plugins/nhk-core/src/Application/Video/VideoUrlPolicy.php
            python3 tools/resolve-public-url-main-sync.py
            git add docs/architecture/VIDEO_SEMANTIC_INGEST_CONTRACT.md public/wp-content/plugins/nhk-core
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP lint
        run: composer lint
      - name: Full unit suite and diagnostic
        shell: bash
        run: |
          set +e
          vendor/bin/phpunit --testsuite 'NHK Unit' > /tmp/unit.log 2>&1
          code=$?
          set -e
          cat /tmp/unit.log
          if [ "$code" -ne 0 ]; then
            git merge --abort || true
            cp /tmp/unit.log tools/sync-test-failure.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools/sync-test-failure.txt
            git commit -m 'ci: record URL sync unit failure [skip sync-main]' || true
            git push origin HEAD:feature/canonical-public-slug-policy || true
            exit "$code"
          fi
      - name: Commit verified merge and push
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor origin/main HEAD; then exit 0; fi
          git commit -m 'chore: sync main into canonical URL branch [skip sync-main]'
          git push origin HEAD:feature/canonical-public-slug-policy
