name: Sync main into canonical URL branch

on:
  push:
    branches: [feature/canonical-public-slug-policy]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip sync-main]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - name: Merge main and resolve URL-policy overlap
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff origin/main
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            # Main already contains the current canonical Video contract/tests.
            git checkout --theirs -- \
              docs/architecture/VIDEO_SEMANTIC_INGEST_CONTRACT.md \
              public/wp-content/plugins/nhk-core/tests/Unit/PublicIdentityServiceTest.php \
              public/wp-content/plugins/nhk-core/tests/Unit/VideoSemanticCoreTest.php \
              public/wp-content/plugins/nhk-core/tests/Unit/VideoUrlPolicyTest.php

            # Keep main as the base for production overlaps, then add only the
            # URL-maintenance compatibility seams still unique to this branch.
            git checkout --theirs -- \
              public/wp-content/plugins/nhk-core/nhk-core.php \
              public/wp-content/plugins/nhk-core/src/Application/Entity/PublicRouteResolver.php \
              public/wp-content/plugins/nhk-core/src/Application/PublicIdentity/CanonicalPublicSlugPolicy.php \
              public/wp-content/plugins/nhk-core/src/Application/PublicIdentity/PublicIdentityService.php \
              public/wp-content/plugins/nhk-core/src/Application/Video/VideoUrlPolicy.php

            python3 <<'PY'
from pathlib import Path

# CanonicalPublicSlugPolicy: retain main static API and add feature compatibility + collision resolver.
p=Path('public/wp-content/plugins/nhk-core/src/Application/PublicIdentity/CanonicalPublicSlugPolicy.php')
s=p.read_text()
marker='    /**\n     * Build shortest-first public slug candidates from meaningful domain data.\n'
insert='''    /** Compatibility instance API for application services. */\n    public function slug(string $value): string\n    {\n        return self::normalize($value);\n    }\n\n    /**\n     * Resolve the shortest available meaningful public slug. Technical IDs,\n     * hashes and timestamps are never invented by this policy.\n     *\n     * @param list<string> $meaningfulQualifiers\n     * @param callable(string):bool $isTaken\n     */\n    public function resolve(string $value, array $meaningfulQualifiers, callable $isTaken): string\n    {\n        $base = self::normalize($value);\n        if ($base === '') throw new \\InvalidArgumentException('PUBLIC_SLUG_INVALID');\n        if (!$isTaken($base)) return $base;\n        foreach (self::candidates($value, $meaningfulQualifiers) as $candidate) {\n            if ($candidate === $base) continue;\n            if (!$isTaken($candidate)) return $candidate;\n        }\n        throw new \\RuntimeException('PUBLIC_SLUG_COLLISION_REQUIRES_RECONCILIATION');\n    }\n\n'''
if 'public function resolve(' not in s:
    s=s.replace(marker, insert+marker)
p.write_text(s)

# PublicIdentityService: retain main API, add canonical allocation and guarded pre-public reprojection.
p=Path('public/wp-content/plugins/nhk-core/src/Application/PublicIdentity/PublicIdentityService.php')
s=p.read_text()
alloc_marker='    public function changeSlug(string $identityId, string $slug, int $expectedRevision, string $idempotencyKey): array\n'
alloc='''    /** @param list<string> $meaningfulQualifiers */\n    public function allocateCanonical(string $ownerKind, string $ownerId, string $routeType, string $scope, string $publicName, array $meaningfulQualifiers, string $idempotencyKey): array\n    {\n        if ($ownerKind === '' || !UuidCodec::isValid($ownerId) || $routeType === '' || $scope === '' || $idempotencyKey === '') throw new \\InvalidArgumentException('PUBLIC_IDENTITY_INPUT_INVALID');\n        $policy = new CanonicalPublicSlugPolicy();\n        $slug = $policy->resolve($publicName, $meaningfulQualifiers, function (string $candidate) use ($routeType, $scope): bool {\n            if (($this->nativeRouteExists)($candidate)) return true;\n            return method_exists($this->repository, 'slugExists') && (bool) $this->repository->slugExists($routeType, $scope, $candidate, null);\n        });\n        return $this->repository->allocate($this->record($ownerKind, $ownerId, $routeType, $scope, $slug), $idempotencyKey);\n    }\n\n'''
if 'allocateCanonical(' not in s:
    s=s.replace(alloc_marker, alloc+alloc_marker)
change_end="        return $this->repository->change($record, (string) $current['current_path'], $expectedRevision, $idempotencyKey);\n    }\n\n    private function record"
reproject="""        return $this->repository->change($record, (string) $current['current_path'], $expectedRevision, $idempotencyKey);\n    }\n\n    /** Pre-public URL projection maintenance; semantic identity is unchanged. */\n    public function reproject(string $identityId, string $publicName, string $scope, int $expectedRevision, string $idempotencyKey): array\n    {\n        if (trim($scope) === '' || $identityId === '' || $expectedRevision < 1 || $idempotencyKey === '') throw new \\InvalidArgumentException('PUBLIC_IDENTITY_INPUT_INVALID');\n        $current = $this->repository->findCurrentById($identityId);\n        if ($current === null) throw new \\RuntimeException('NOT_FOUND');\n        if ((int) ($current['revision'] ?? 0) !== $expectedRevision) throw new \\RuntimeException('STALE_REVISION');\n        $slug = CanonicalPublicSlugPolicy::normalize($publicName);\n        if ($slug === '') throw new \\InvalidArgumentException('PUBLIC_SLUG_INVALID');\n        if (($this->nativeRouteExists)($slug)) throw new \\RuntimeException('NATIVE_ROUTE_CONFLICT');\n        $record = $current;\n        $record['current_slug'] = $slug;\n        $record['collision_scope'] = trim($scope);\n        $record['route_policy_version'] = '2';\n        return $this->repository->change($record, (string) $current['current_path'], $expectedRevision, $idempotencyKey);\n    }\n\n    private function record"""
if 'public function reproject(' not in s:
    s=s.replace(change_end, reproject)
p.write_text(s)

# PublicRouteResolver: prefer persisted Public Identity when present, then retain main collision fallback.
p=Path('public/wp-content/plugins/nhk-core/src/Application/Entity/PublicRouteResolver.php')
s=p.read_text()
s=s.replace('use NHK\\Core\\Application\\PublicIdentity\\CanonicalPublicSlugPolicy;', 'use NHK\\Core\\Application\\PublicIdentity\\{CanonicalPublicSlugPolicy, PublicIdentityReadRegistry};\nuse NHK\\Core\\Contracts\\PublicIdentity\\PublicIdentityRepository;')
s=s.replace('private ?\\Closure $nativeRootExists = null) {}', 'private ?\\Closure $nativeRootExists = null, private ?PublicIdentityRepository $publicIdentities = null) {}')
needle='''    private function publicSlug(AuthorityEntity $entity, ?string $parentId = null): ?string\n    {\n        foreach ($this->candidateSlugs($entity) as $candidate) {'''
replacement='''    private function publicSlug(AuthorityEntity $entity, ?string $parentId = null): ?string\n    {\n        $repository = $this->publicIdentities ?? PublicIdentityReadRegistry::repository();\n        if ($repository !== null) {\n            try {\n                $identity = $repository->findCurrentByOwner('authority', $entity->canonicalId, $entity->entityType);\n                if (is_array($identity)) {\n                    $stored = trim((string) ($identity['current_slug'] ?? ''));\n                    return $stored !== '' && CanonicalPublicSlugPolicy::isCanonical($stored) ? $stored : null;\n                }\n            } catch (\\Throwable) {\n                // Demo compatibility fallback only; semantic identity is never changed.\n            }\n        }\n        foreach ($this->candidateSlugs($entity) as $candidate) {'''
if 'PublicIdentityReadRegistry::repository()' not in s:
    s=s.replace(needle,replacement)
p.write_text(s)

# VideoUrlPolicy: central persisted identity wins over stale metadata.
p=Path('public/wp-content/plugins/nhk-core/src/Application/Video/VideoUrlPolicy.php')
s=p.read_text()
s=s.replace('use NHK\\Core\\Domain\\Video\\Video;', 'use NHK\\Core\\Application\\PublicIdentity\\{CanonicalPublicSlugPolicy, PublicIdentityReadRegistry};\nuse NHK\\Core\\Contracts\\PublicIdentity\\PublicIdentityRepository;\nuse NHK\\Core\\Domain\\Video\\Video;')
s=s.replace('final class VideoUrlPolicy\n{', 'final class VideoUrlPolicy\n{\n    public function __construct(private ?PublicIdentityRepository $publicIdentities = null) {}')
s=s.replace("        $identity = is_array($metadata['public_identity'] ?? null) ? $metadata['public_identity'] : [];\n        $blockers = [];\n        $slug = trim((string) ($identity['current_slug'] ?? ''));\n        if ($slug === '' || preg_match('/^[a-z0-9]+(?:-[a-z0-9]+)*$/', $slug) !== 1) $blockers[] = 'PUBLIC_IDENTITY_NOT_PERSISTED';", "        $blockers = [];\n        $slug = $this->publicSlug($video, $metadata, $blockers);\n        if ($slug === '' || !CanonicalPublicSlugPolicy::isCanonical($slug)) $blockers[] = 'PUBLIC_IDENTITY_NOT_PERSISTED';")
ctx_marker='    /** @return array<string,mixed> */\n    private function context(array $metadata): array\n'
helper='''    /** @param list<string> $blockers */\n    private function publicSlug(Video $video, array $metadata, array &$blockers): string\n    {\n        $repository = $this->publicIdentities ?? PublicIdentityReadRegistry::repository();\n        if ($repository !== null) {\n            try {\n                $identity = $repository->findCurrentByOwner('video', $video->canonicalId, 'video');\n            } catch (\\Throwable) {\n                $blockers[] = 'PUBLIC_IDENTITY_STORAGE_UNAVAILABLE';\n                return '';\n            }\n            if (is_array($identity)) return trim((string) ($identity['current_slug'] ?? ''));\n        }\n        $identity = is_array($metadata['public_identity'] ?? null) ? $metadata['public_identity'] : [];\n        return trim((string) ($identity['current_slug'] ?? ''));\n    }\n\n'''
if 'private function publicSlug(Video' not in s:
    s=s.replace(ctx_marker,helper+ctx_marker)
p.write_text(s)

# Composition root: preserve main admin/dossier boot and add public identity registry + WP slug bridge.
p=Path('public/wp-content/plugins/nhk-core/nhk-core.php')
s=p.read_text()
s=s.replace('namespace NHK\\Core;\n\n', 'namespace NHK\\Core;\n\nuse NHK\\Core\\Application\\PublicIdentity\\PublicIdentityReadRegistry;\n')
s=s.replace('use NHK\\Core\\Infrastructure\\Frontend\\FrontendSemanticBootstrap;', 'use NHK\\Core\\Infrastructure\\Frontend\\FrontendSemanticBootstrap;\nuse NHK\\Core\\Infrastructure\\PublicIdentity\\{WordPressPublicSlugBridge, WpdbPublicIdentityRepository};')
boot='''Plugin::boot(__FILE__);'''
replacement='''global $wpdb;\nif (is_object($wpdb)) PublicIdentityReadRegistry::register(new WpdbPublicIdentityRepository($wpdb));\nPlugin::boot(__FILE__);\n(new WordPressPublicSlugBridge())->register();'''
if 'PublicIdentityReadRegistry::register' not in s:
    s=s.replace(boot,replacement)
p.write_text(s)
PY
            git add docs/architecture/VIDEO_SEMANTIC_INGEST_CONTRACT.md public/wp-content/plugins/nhk-core
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Diff check
        run: git diff --check origin/main...HEAD || git diff --check origin/main
      - name: PHP lint
        run: composer lint
      - name: Full unit suite on merged worktree
        run: vendor/bin/phpunit --testsuite 'NHK Unit'
      - name: Commit verified merge and push
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor origin/main HEAD; then exit 0; fi
          git commit -m 'chore: sync main into canonical URL branch [skip sync-main]'
          git push origin HEAD:feature/canonical-public-slug-policy
