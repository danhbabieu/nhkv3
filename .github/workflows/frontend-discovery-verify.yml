name: Frontend discovery verification
# rerun after assertion fix
on:
  push:
    branches: [feature/frontend-discovery-redesign-20261002]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Diff check
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
      - name: Lint changed PHP
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD -- '*.php' | while IFS= read -r file; do
            if [ -n "$file" ]; then php -l "$file"; fi
          done
      - name: Focused frontend tests
        run: |
          vendor/bin/phpunit \
            public/wp-content/plugins/nhk-core/tests/Unit/FrontendPresentationContractTest.php \
            public/wp-content/plugins/nhk-core/tests/Unit/PresentationNavigation/PresentationNavigationFrontendContractTest.php \
            public/wp-content/plugins/nhk-core/tests/Unit/HomeSemanticQueryTest.php
      - name: Contract tests
        run: vendor/bin/phpunit --testsuite 'NHK Contract'
